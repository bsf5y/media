<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSF5Y Logo Color Mockups</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Outfit', system-ui, sans-serif; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    max-width: 1400px;
    margin: 0 auto;
  }

  .card {
    padding: 3rem 2.5rem;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1rem;
  }

  .card.light { background: #faf9f7; }
  .card.dark  { background: #12151a; }

  .label {
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
    padding: 0.25rem 0.5rem;
    border-radius: 3px;
  }
  .light .label { color: #495057; background: #e8e6e3; }
  .dark  .label { color: #a8b0ba; background: #232830; }

  .desc {
    font-size: 0.85rem;
    line-height: 1.5;
    max-width: 380px;
  }
  .light .desc { color: #495057; }
  .dark  .desc { color: #8b9199; }

  .card svg {
    width: 340px;
    height: auto;
    display: block;
    margin: 0.5rem 0;
  }

  h1 {
    text-align: center;
    padding: 2.5rem 1rem 0.5rem;
    font-size: 1.5rem;
    font-weight: 600;
    color: #1a1e25;
  }
  h1 small {
    display: block;
    font-size: 0.85rem;
    font-weight: 400;
    color: #8b9199;
    margin-top: 0.25rem;
  }

  .divider {
    border: none;
    border-top: 1px solid #e8e6e3;
    margin: 1rem auto;
    width: 90%;
    max-width: 1400px;
  }

  .current-label {
    text-align: center;
    font-size: 0.8rem;
    color: #8b9199;
    padding: 0.5rem;
    letter-spacing: 0.05em;
  }
</style>
</head>

function buildSVG(icon, lettering) {
  return `<svg viewBox="0 0 2667 1066" fill="none" xmlns="http://www.w3.org/2000/svg">${icon}${lettering}</svg>`;
}

// Light theme colors
const lt = { text: '#1a1e25', muted: '#232830', accent: '#d97706', stroke: '#000000', border: 'rgba(0,0,0,0.2)' };
// Dark theme colors
const dk = { text: '#e8e6e3', muted: '#a8b0ba', accent: '#d97706', stroke: '#e8e6e3', border: 'rgba(255,255,255,0.08)' };

const options = [
  {
    name: 'Option A',
    desc: 'BSF+Y in text, 5 in accent. Clean, confident, uniform.',
    light: { bsf: lt.text, five: lt.accent, y: lt.text },
    dark:  { bsf: dk.text, five: dk.accent, y: dk.text }
  },
  {
    name: 'Option C',
    desc: 'All lettering in accent. Bold single-color wordmark.',
    light: { bsf: lt.accent, five: lt.accent, y: lt.accent },
    dark:  { bsf: dk.accent, five: dk.accent, y: dk.accent }
  },
  {
    name: 'Option D',
    desc: 'BSF+Y in text-muted, 5 in accent. Understated base, pop highlight.',
    light: { bsf: lt.muted, five: lt.accent, y: lt.muted },
    dark:  { bsf: dk.muted, five: dk.accent, y: dk.muted }
  }
];

options.forEach(opt => {
  document.write(`
    <p class="current-label">${opt.name.toUpperCase()} — Two-tone icon + ${opt.desc.split('.')[0]}</p>
    <div class="grid">
      <div class="card light">
        <span class="label">${opt.name} &middot; Light</span>
        ${buildSVG(
          iconPaths(lt.text, lt.accent, lt.stroke, lt.border),
          letteringPaths(opt.light.bsf, opt.light.five, opt.light.y)
        )}
        <span class="desc">${opt.desc}</span>
      </div>
      <div class="card dark">
