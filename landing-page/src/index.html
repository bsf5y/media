<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Bootstrap Factory — Products, Not Prototypes</title>
  <meta name="description" content="Champaign-Urbana technology consultancy helping early-stage founders build products, not prototypes. Fractional CTO leadership and turn-key infrastructure.">

  <!-- Fonts: Outfit (display), JetBrains Mono (technical), Source Serif 4 (body quotes) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;500;600;700;800&family=Source+Serif+4:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

  <!-- Critical CSS inlined for faster First Contentful Paint -->
  <style>
    /* Critical reset and base styles */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background-color: #0a0c0f;
      color: #e8e6e3;
      min-height: 100vh;
    }
    /* Skip link - visible on focus */
    .skip-link {
      position: absolute;
      top: -100%;
      left: 50%;
      transform: translateX(-50%);
      background: #d97706;
      color: #0a0c0f;
      padding: 0.75rem 1.5rem;
      border-radius: 0 0 0.5rem 0.5rem;
      font-weight: 600;
      z-index: 9999;
      transition: top 0.2s;
    }
    .skip-link:focus {
      top: 0;
      outline: 2px solid #f59e0b;
      outline-offset: 2px;
    }
    /* Header skeleton to prevent layout shift */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 1.5rem 0;
    }
  </style>

  <!-- Main stylesheet with preload for faster loading -->
  <link rel="preload" href="./styles/main.css" as="style">
  <link rel="stylesheet" href="./styles/main.css">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏭</text></svg>">
</head>
<body>
  <!-- Skip to main content link for accessibility -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Blueprint grid overlay -->
  <div class="grid-overlay" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container">
      <a href="/" class="logo">
        <span class="logo-mark">BSF5Y</span>
        <span class="logo-text">The Bootstrap Factory</span>
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="#methodology">Methodology</a>
        <a href="#services">Services</a>
        <button class="mode-toggle" aria-label="Toggle light/dark mode" title="Toggle light/dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <a href="#contact" class="nav-cta">Let's Talk</a>
      </nav>
    </div>
  </header>

  <main id="main-content" tabindex="-1">
    <!-- Hero Section -->
    <section class="hero">
      <div class="container">
        <div class="hero-content">
          <h1 class="hero-tagline" data-content="hero.tagline"></h1>

          <blockquote class="hero-lead">
            <p data-content="hero.lead"></p>
          </blockquote>

          <div class="hero-reframe">
            <span class="reframe-label">The Reframe</span>
            <p class="reframe-text" data-content="hero.reframe"></p>
          </div>

          <div data-content="hero.subtext"></div>
        </div>

        <div class="hero-visual" aria-hidden="true">
          <div class="blueprint-element blueprint-circle"></div>
          <div class="blueprint-element blueprint-lines"></div>
          <div class="blueprint-element blueprint-box"></div>
        </div>
      </div>
    </section>

    <!-- Positioning Section -->
    <section class="positioning">
      <div class="container" data-content="positioning._content"></div>
    </section>

    <!-- Methodology Section -->
    <section class="methodology" id="methodology">
      <div class="container">
        <header class="section-header">
          <span class="section-label">Our Approach</span>
          <h2 class="section-title" data-content="methodology.headline"></h2>
          <p class="section-intro" data-content="methodology.intro"></p>
        </header>

        <div class="phases" data-content="methodology.phases"></div>
      </div>
    </section>

    <!-- Services Section -->
    <section class="services" id="services">
      <div class="container">
        <header class="section-header">
          <span class="section-label">What We Do</span>
          <h2 class="section-title">Solutions, Not Capabilities</h2>
        </header>

        <div class="services-grid" data-content="services"></div>
      </div>
    </section>

    <!-- CTA Section -->
    <section class="cta" id="contact">
      <div class="container">
        <h2 class="cta-headline" data-content="cta.headline"></h2>
        <p class="cta-subtext" data-content="cta.subtext"></p>
        <a href="mailto:hello@bootstrapfactory.io" class="cta-button">
          <span data-content="cta.button"></span>
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M4 10h12M12 6l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-brand">
          <span class="footer-logo">BSF5Y</span>
          <p class="footer-location" data-content="footer.location"></p>
          <p class="footer-tagline" data-content="footer.tagline"></p>
        </div>
        <div class="footer-links">
          <a href="#methodology">Methodology</a>
          <a href="#services">Services</a>
          <a href="mailto:hello@bootstrapfactory.io">Contact</a>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; <span id="year"></span> <span data-content="footer.copyright"></span>. Products, not prototypes.</p>
      </div>
    </div>
  </footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
