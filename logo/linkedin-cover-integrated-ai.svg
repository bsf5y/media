<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  LinkedIn Company Cover · "Integrated AI" (light)
  ────────────────────────────────────────────────
  Concept: A three-layer system schematic that visualises the "integrated,
  not bolt-on" thesis. Interfaces sit above; the protected core holds your
  data, rules, and AI orchestration; the model layer below is explicitly
  shown as swappable (GPT · Claude · Gemini · Local). Reinforces that AI
  pilots fail for the same reason prototypes do — value trapped in the
  prompt instead of captured in the system.

  Canvas: 1128 × 191  (LinkedIn company page banner, 5.91:1)
  Avatar safe-zone: x=0–320, y=40–191 — LinkedIn's company avatar overlay
  covers the lower-left of the cover; the tagline block starts at x=336.

  Palette: light (pure #ffffff field, dark ink, brand copper/steel accents)
  — matches LinkedIn's UI chrome so the cover blends seamlessly with the
  surrounding company-page layout (no visible seam at the cover edge).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1128 191"
     width="1128" height="191"
     role="img"
     aria-label="The Bootstrap Factory — Integrated AI. Not Bolt-On.">
  <title>BSF5Y — Integrated AI. Not Bolt-On. (LinkedIn cover · Light)</title>
  <defs>
    <pattern id="ai-grid-fine" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#d97706" stroke-opacity="0.06" stroke-width="0.5"/>
    </pattern>
    <pattern id="ai-grid-coarse" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#d97706" stroke-opacity="0.12" stroke-width="0.5"/>
    </pattern>
    <style>
      .ai-bg          { fill: #ffffff; }
      .ai-display     { font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif; font-weight: 700; fill: #1a1e25; letter-spacing: -0.02em; }
      .ai-body        { font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif; font-weight: 400; fill: #4a5160; letter-spacing: -0.005em; }
      .ai-mono        { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace; font-weight: 500; fill: #555a63; letter-spacing: 0.12em; }
      .ai-mono-accent { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace; font-weight: 700; fill: #b35d00; letter-spacing: 0.12em; }
      .ai-mono-cool   { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace; font-weight: 600; fill: #2563eb; letter-spacing: 0.10em; }
      .ai-accent      { fill: #d97706; }
      .ai-layer-box   { fill: none; stroke: #3b82f6; stroke-opacity: 0.6; stroke-width: 0.9; }
      .ai-core-box    { fill: rgba(217, 119, 6, 0.08); stroke: #d97706; stroke-width: 1.4; }
      .ai-dim         { stroke: #3b82f6; stroke-opacity: 0.65; stroke-width: 0.6; }
      .ai-dim-accent  { stroke: #d97706; stroke-width: 0.8; }
    </style>
  </defs>

  <!-- field -->
  <rect class="ai-bg" width="1128" height="191"/>
  <rect width="1128" height="191" fill="url(#ai-grid-fine)"/>
  <rect width="1128" height="191" fill="url(#ai-grid-coarse)"/>

  <!-- top register (sits above the avatar overlay) -->
  <g transform="translate(40, 24)">
    <rect class="ai-accent" x="0" y="-4" width="22" height="2"/>
    <text x="34" y="0" class="ai-mono" font-size="10">BSF5Y · THE BOOTSTRAP FACTORY · CHAMPAIGN-URBANA, IL</text>
  </g>
  <text x="1088" y="24" text-anchor="end" class="ai-mono" font-size="10">AI INTEGRATION · ARCHITECTURE</text>

  <!-- divider -->
  <line x1="40" y1="38" x2="1088" y2="38" stroke="#1a1e25" stroke-opacity="0.10" stroke-width="0.5"/>

  <!-- left: tagline (shifted right of avatar safe-zone) -->
  <g transform="translate(336, 0)">
    <rect class="ai-accent" x="-14" y="58" width="4" height="92"/>
    <text x="0" y="84"  class="ai-display" font-size="28">Integrated AI.</text>
    <text x="0" y="116" class="ai-display" font-size="28">Not Bolt-On.</text>
    <text x="0" y="140" class="ai-body"    font-size="12">AI pilots fail for the same reason prototypes do.</text>
    <text x="0" y="166" class="ai-mono-accent" font-size="9">// VALUE LIVES IN THE SYSTEM — NOT THE PROMPT</text>
  </g>

  <!-- right: layered AI architecture with dimensional callouts -->
  <g transform="translate(728, 52)">
    <!-- drafting corner ticks -->
    <path d="M -6 -6 L 0 -6 M -6 -6 L -6 0"     stroke="#3b82f6" stroke-opacity="0.7" stroke-width="0.7" fill="none"/>
    <path d="M 286 -6 L 280 -6 M 286 -6 L 286 0" stroke="#3b82f6" stroke-opacity="0.7" stroke-width="0.7" fill="none"/>
    <path d="M -6 104 L 0 104 M -6 104 L -6 98"  stroke="#3b82f6" stroke-opacity="0.7" stroke-width="0.7" fill="none"/>
    <path d="M 286 104 L 280 104 M 286 104 L 286 98" stroke="#3b82f6" stroke-opacity="0.7" stroke-width="0.7" fill="none"/>

    <!-- Interfaces layer -->
    <rect class="ai-layer-box" x="0" y="0"  width="280" height="26" rx="2"/>
    <text x="14" y="17" class="ai-mono" font-size="9">INTERFACES · UI · CHAT · API</text>

    <!-- Protected core (data + rules + AI orchestration) -->
    <rect class="ai-core-box" x="0" y="34" width="280" height="34" rx="2"/>
    <text x="14" y="56" class="ai-mono-accent" font-size="10">CORE · YOUR DATA · YOUR RULES</text>

    <!-- Models layer (swappable) -->
    <rect class="ai-layer-box" x="0" y="76" width="280" height="26" rx="2"/>
    <text x="14" y="93" class="ai-mono" font-size="9">MODELS · GPT · CLAUDE · GEMINI · LOCAL</text>

    <!-- right-side dimension callouts -->
    <g transform="translate(290, 0)">
      <line class="ai-dim" x1="0" y1="13" x2="22" y2="13"/>
      <text x="28" y="16" class="ai-mono-cool" font-size="9">SWAPPABLE</text>

      <line class="ai-dim-accent" x1="0" y1="51" x2="22" y2="51"/>
      <text x="28" y="54" class="ai-mono-accent" font-size="9">YOURS</text>

      <line class="ai-dim" x1="0" y1="89" x2="22" y2="89"/>
      <text x="28" y="92" class="ai-mono-cool" font-size="9">SWAPPABLE</text>
    </g>
  </g>
</svg>
